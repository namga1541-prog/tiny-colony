<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<meta name="mobile-web-app-capable" content="yes">
<title>타이니 콜로니 — 작은 개척지</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage"></div>

<!-- 상단 HUD -->
<div id="topbar" class="hud">
  <div class="hud-group" id="clockBox">
    <span id="dayLabel">1일차</span>
    <span id="timeLabel">08:00</span>
  </div>
  <div class="hud-group" id="resBox">
    <span class="res" title="목재 — 건설·제작 재료"><img src="assets/ts/W_Idle.png" alt=""><span class="res-lbl">목재</span> <b id="resWood">0</b></span>
    <span class="res" title="금 — 고급 건물·제작 재료"><img src="assets/ts/G_Idle.png" alt=""><span class="res-lbl">금</span> <b id="resGold">0</b></span>
    <span class="res" title="식량 — 정착민이 소비 (부족하면 굶주림)"><img src="assets/ts/Food_Grain.png" alt=""><span class="res-lbl">식량</span> <b id="resFood">0</b></span>
    <span class="res" title="저장고: 사용량 / 최대 용량 — 가득 차면 채집·수확이 멈춥니다. 창고를 지어 용량을 늘리세요."><span class="res-ic">📦</span><span class="res-lbl">저장고</span> <b id="resStorage">0/0</b></span>
    <span class="res" title="정착민 수 (현재 인구)"><span class="res-ic">👥</span><span class="res-lbl">인구</span> <b id="resPop">3</b></span>
  </div>
  <div class="hud-group" id="speedBox">
    <button class="spd" data-speed="0" title="일시정지 (P)">⏸</button>
    <button class="spd active" data-speed="1" title="보통 (1)">▶</button>
    <button class="spd" data-speed="2" title="빠름 (2)">▶▶</button>
    <button class="spd" data-speed="3" title="최고 속도 (3)">▶▶▶</button>
  </div>
  <div class="hud-group" id="sysBox">
    <button id="btnMute" title="음소거 전환">🔊</button>
    <button id="btnSave" title="저장">💾</button>
    <button id="btnLoad" title="불러오기">📂</button>
    <button id="btnNew" title="새 게임">🆕</button>
    <button id="btnCancelTouch" class="touch-only" title="선택·도구 취소">✕</button>
  </div>
</div>

<!-- 하단 도구모음 -->
<div id="toolbar" class="hud">
  <div class="tool-section">
    <button class="tool active" data-tool="select" title="선택">🖱️ 선택</button>
    <button class="tool" data-tool="chop" title="나무를 벌목하도록 지시 (드래그)">🪓 벌목</button>
    <button class="tool" data-tool="mine" title="금광을 채굴하도록 지시 (금광 위에 드래그)">⛏️ 채굴</button>
    <button class="tool" data-tool="forage" title="버섯을 수확하도록 지시 (드래그)">🧺 채집</button>
    <button class="tool" data-tool="hunt" title="동물을 사냥하도록 지시 — 고기 획득 (드래그)">🥩 사냥</button>
    <button class="tool" data-tool="fish" title="물가를 낚시터로 지정 — 확률로 다양한 어종 (드래그)">🎣 낚시</button>
    <button class="tool" data-tool="farm" title="농업 연구 필요 — 밀을 심고 수확하는 구역 지정 (드래그)">🌾 농사</button>
    <button class="tool" data-tool="cancel" title="지시·설계도 취소 (드래그)">✖️ 취소</button>
  </div>
  <div class="tool-sep"></div>
  <div class="tool-section">
    <button class="tool" data-tool="house" title="목재 10 — 정착촌의 기본 건물">🏠 집</button>
    <button class="tool" data-tool="smithy" title="목재 12 + 금 4 — 무기(검·활)를 제작하는 대장간. 제작하려면 먼저 지으세요">🛠️ 대장간</button>
    <button class="tool" data-tool="warehouse" title="목재 12 — 완공 시 주변에 비축 구역이 자동 지정됩니다">🏚️ 창고</button>
    <button class="tool" data-tool="tower" title="목재 15 + 금 5 — 밤을 밝힙니다">🗼 망루</button>
    <button class="tool" data-tool="outpost" title="목재 8 — 저렴한 초소 (조명 없음)">🛡️ 초소</button>
    <button class="tool" data-tool="castle" title="목재 30 + 금 10 — 콜로니의 위용!">🏰 성</button>
    <button class="tool" data-tool="campfire" title="목재 2 — 밤을 밝힙니다">🔥 모닥불</button>
    <button class="tool" data-tool="ranch" title="목재 14 — 주기적으로 식량 생산 + 가축(양·돼지·소·닭) 번식">🐑 목장</button>
    <button class="tool" data-tool="clinic" title="목재 10 + 금 3 — 부상 정착민이 빠르게 회복">🏥 치료소</button>
    <button class="tool" data-tool="bridge" title="목재 2 — 물 위에 띄워 바다 건너 다른 대륙으로 (한 줄로 드래그)">🚣 뗏목</button>
    <button class="tool" data-tool="demolish" title="건축물 철거 (자재 일부 회수)">🔨 철거</button>
  </div>
  <div class="tool-sep"></div>
  <div class="tool-section">
    <button id="btnResearch" class="tool-action" title="연구 포인트를 모아 기술을 해금합니다">📚 연구</button>
    <button id="btnCraft" class="tool-action" title="대장간 기술 연구 후 검·활을 제작합니다">⚒️ 제작</button>
    <button id="btnGoals" class="tool-action" title="목표(도전 과제) 확인">🏆 목표</button>
    <button id="btnUpgrades" class="tool-action" title="자원을 써서 콜로니를 영구 강화 (생산·물류·방어·인구)">📈 업그레이드</button>
    <button id="btnHire" class="tool-action" title="식량을 지불하고 새 정착민을 고용합니다">🧑‍🌾 고용</button>
  </div>
</div>

<!-- 미니맵 (우상단) -->
<div id="minimapBox" class="hud"><canvas id="minimap" width="160" height="160"></canvas></div>

<!-- 정착민 명단 (좌측) -->
<div id="roster" class="hud"></div>

<!-- 우하단 이벤트 피드 -->
<div id="eventFeed"></div>

<!-- 정착민 패널 -->
<div id="pawnPanel" class="hud hidden">
  <div id="pawnName">이름</div>
  <div id="pawnTask" class="pawn-task">대기 중</div>
  <div class="need">
    <span>🍖 포만감</span>
    <div class="bar"><div id="barHunger" class="fill hunger"></div></div>
  </div>
  <div class="need">
    <span>❤️ 체력</span>
    <div class="bar"><div id="barHp" class="fill hp"></div></div>
  </div>
  <div class="need">
    <span>😊 기분</span>
    <div class="bar"><div id="barMood" class="fill mood"></div></div>
  </div>
  <div id="pawnTrait" class="pawn-trait"></div>
  <div id="pawnSkills" class="pawn-skills"></div>
  <div id="pawnEquip" class="pawn-equip"></div>
  <button id="btnEditPawn">✏️ 이름·외형 변경</button>
</div>

<!-- 건물 정보 패널 -->
<div id="buildPanel" class="hud hidden">
  <div id="bpName">건물</div>
  <div id="bpDesc" class="bp-desc"></div>
  <div id="bpStats" class="bp-stats"></div>
</div>

<div id="toastHost"></div>
<div id="hint" class="hud">정착민 클릭·드래그: 선택 (WASD 이동 · Space 작업) · 우클릭(짧게)/ESC: 취소 · 우클릭 드래그·화살표: 화면 이동 · 휠: 줌 · P: 일시정지</div>

<!-- 터치 컨트롤 (모바일 — 정착민 조종 중에만 표시) -->
<div id="vJoyPad"><div id="vJoyKnob"></div></div>
<button id="btnActionTouch" title="상호작용 (Space)">▶</button>

<script src="vendor/pixi.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
